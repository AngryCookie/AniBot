<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AniBot Admin - PvP</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body data-page="pvp">
    <header>
      <h1>AniBot Web Admin</h1>
    </header>
    <main>
      <div class="notice" id="guildIdLabel">Guild: —</div>
      <nav>
        <a href="/overview.html" data-page="overview">Overview</a>
        <a href="/leveling.html" data-page="leveling">Leveling</a>
        <a href="/economy.html" data-page="economy">Economy</a>
        <a href="/gambling.html" data-page="gambling">Gambling</a>
        <a href="/pvp.html" data-page="pvp">PvP</a>
        <a href="/shop.html" data-page="shop">Shop</a>
        <a href="/logs.html" data-page="logs">Logs</a>
      </nav>
      <section class="card">
        <h2>Настройки PvP-дуэлей</h2>
        <form id="settingsForm">
          <label>
            <span>Включить PvP</span>
            <input type="checkbox" name="enabled" />
          </label>
          <label>
            <span>Минимальная ставка</span>
            <input type="number" name="min_bet" min="1" max="100000" />
          </label>
          <label>
            <span>Максимальная ставка</span>
            <input type="number" name="max_bet" min="1" max="1000000" />
          </label>
          <label>
            <span>Кулдаун (сек)</span>
            <input type="number" name="cooldown_seconds" min="0" max="86400" />
          </label>
          <label>
            <span>Макс. активных дуэлей на пользователя</span>
            <input type="number" name="max_active_duels_per_user" min="1" max="10" step="1" />
          </label>
          <label>
            <span>Влияние уровня (%)</span>
            <input type="number" name="level_influence_percent" min="0" max="100" step="1" />
          </label>
          <div class="footer-actions">
            <button type="submit">Сохранить</button>
            <button type="button" class="danger" id="resetSettings">Сбросить</button>
          </div>
        </form>
      </section>

      <section class="card">
        <h2>Сезоны PvP</h2>
        <form id="seasonSettingsForm">
          <label>
            <span>Включить сезоны</span>
            <input type="checkbox" name="enabled" />
          </label>
          <label>
            <span>Автозакрытие сезонов</span>
            <input type="checkbox" name="auto_close_enabled" />
          </label>
          <label>
            <span>Длительность сезона (дней)</span>
            <input type="number" name="season_duration_days" min="1" max="365" />
          </label>
          <label>
            <span>ID канала анонса итогов</span>
            <input type="number" name="announce_channel_id" min="1" step="1" />
          </label>
          <label>
            <span>Режим сброса</span>
            <select name="reset_mode">
              <option value="hard">hard (полный сброс)</option>
              <option value="soft">soft (сброс только рейтинга)</option>
            </select>
          </label>
          <label>
            <span>ID роли для топ-1</span>
            <input type="number" name="top1_role_id" min="1" step="1" />
          </label>
          <label>
            <span>ID роли для топ-3</span>
            <input type="number" name="top3_role_id" min="1" step="1" />
          </label>
          <label>
            <span>ID роли для топ-10</span>
            <input type="number" name="top10_role_id" min="1" step="1" />
          </label>
          <div class="footer-actions">
            <button type="submit">Сохранить сезонные настройки</button>
          </div>
        </form>
      </section>
    </main>
    <script src="/static/app.js" defer></script>
  </body>
</html>
