<section class="page-header">
  <h3>PvP</h3>
  <p class="notice">Настройки PvP-дуэлей и аналитика активности.</p>
</section>
<section class="card">
  <h4>Настройки PvP</h4>
  <form data-endpoint="pvp" data-success-message="Настройки PvP сохранены.">
    <label><span>Включить PvP</span><input type="checkbox" name="enabled" /></label>
    <label><span>Мин. ставка</span><input type="number" name="min_bet" min="1" max="100000" required /></label>
    <label><span>Макс. ставка</span><input type="number" name="max_bet" min="1" max="1000000" required /></label>
    <label><span>Кулдаун (сек)</span><input type="number" name="cooldown_seconds" min="0" max="86400" required /></label>
    <label><span>Макс. активных дуэлей</span><input type="number" name="max_active_duels_per_user" min="1" max="10" required /></label>
    <label><span>Влияние уровня (%)</span><input type="number" name="level_influence_percent" min="0" max="100" required /></label>
    <div class="footer-actions"><button type="submit">Сохранить</button><button type="button" class="danger" data-action="reset">Сбросить</button></div>
  </form>
</section>
<section class="card">
  <div class="card-header">
    <h4>Аналитика PvP</h4>
    <div class="period-switcher" id="pvpPeriod">
      <button type="button" class="tab-button is-active" data-period="7">7</button>
      <button type="button" class="tab-button" data-period="30">30</button>
      <button type="button" class="tab-button" data-period="90">90</button>
    </div>
  </div>
  <div class="grid">
    <div class="stat">Дуэлей: <span id="pvpDuels">—</span></div>
    <div class="stat">Объём: <span id="pvpVolume">—</span></div>
    <div class="stat">Сожжено комиссий: <span id="pvpFees">—</span></div>
  </div>
  <canvas id="pvpChart" height="120"></canvas>
  <table class="table hidden" id="pvpFallback"><thead><tr><th>Дата</th><th>Объем</th><th>Комиссии</th></tr></thead><tbody></tbody></table>
</section>
