<section class="card">
  <h3>Word & Emoji Stats Settings</h3>
  <form data-endpoint="word-emoji-stats" class="settings-form" data-success-message="Настройки word/emoji stats сохранены">
    <label class="setting"><span>Enabled</span><input type="checkbox" name="enabled" /></label>
    <label class="setting"><span>Min token length</span><input type="number" min="1" max="20" name="min_token_length" /></label>
    <label class="setting"><span>Max tokens per message</span><input type="number" min="1" max="200" name="max_tokens_per_message" /></label>
    <label class="setting"><span>Ignore bots</span><input type="checkbox" name="ignore_bots" /></label>
    <label class="setting">
      <span>Ignore channel IDs</span>
      <textarea name="ignore_channels" rows="3" placeholder="123,456,789"></textarea>
      <p class="field-hint">Список ID каналов через запятую.</p>
    </label>
    <label class="setting"><span>Retention days</span><input type="number" min="30" max="3650" name="retention_days" /></label>
    <div class="row gap-sm"><button type="submit">Сохранить</button></div>
  </form>
</section>
