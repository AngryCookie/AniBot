<section class="page-header">
  <h3>Betting</h3>
  <p class="notice">Настройки ставок и аналитика объёма выплат.</p>
</section>
<section class="card">
  <h4>Настройки ставок</h4>
  <form data-endpoint="gambling" data-success-message="Настройки ставок сохранены.">
    <label><span>Включить ставки</span><input type="checkbox" name="enabled" /></label>
    <label><span>Минимальная ставка</span><input type="number" name="min_bet" min="1" max="100000" required /></label>
    <label><span>Максимальная ставка</span><input type="number" name="max_bet" min="1" max="1000000" required /></label>
    <label><span>Комиссия дома (%)</span><input type="number" name="house_edge_percent" min="0" max="25" step="0.1" required /></label>
    <label><span>Бонус серии побед</span><input type="checkbox" name="streak_bonus" /></label>
    <div class="footer-actions"><button type="submit">Сохранить</button><button type="button" class="danger" data-action="reset">Сбросить</button></div>
  </form>
</section>
<section class="card">
  <div class="card-header">
    <h4>Аналитика ставок</h4>
    <div class="period-switcher" id="bettingPeriod">
      <button type="button" class="tab-button is-active" data-period="7">7</button>
      <button type="button" class="tab-button" data-period="30">30</button>
      <button type="button" class="tab-button" data-period="90">90</button>
    </div>
  </div>
  <canvas id="bettingChart" height="120"></canvas>
  <table class="table hidden" id="bettingFallback"><thead><tr><th>Дата</th><th>Объем ставок</th><th>Выплаты</th></tr></thead><tbody></tbody></table>
</section>
