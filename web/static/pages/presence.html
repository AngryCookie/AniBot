<h3>Presence</h3>
<form id="presenceForm" class="settings-form stack gap-md">
  <label><input type="checkbox" name="enabled" /> Включить ротацию presence</label>
  <label>Интервал (сек)
    <input type="number" name="interval_seconds" min="60" max="86400" value="300" />
  </label>
  <label>Mode
    <select name="mode">
      <option value="primary_guild">primary_guild</option>
      <option value="rotate_guilds">rotate_guilds</option>
    </select>
  </label>
  <label>Primary Guild ID
    <input type="number" name="primary_guild_id" placeholder="123456789" />
  </label>

  <div>
    <div class="stack gap-sm" id="presenceTemplates"></div>
    <button type="button" class="secondary" id="presenceAddTemplate">Добавить шаблон</button>
  </div>

  <div class="row gap-sm">
    <button type="submit">Сохранить</button>
    <button type="button" class="secondary" id="presencePreviewBtn">Preview</button>
  </div>
</form>
<pre id="presencePreviewOut" class="notice hidden" style="white-space: pre-wrap;"></pre>
