<section class="page-header">
  <h3>Jobs</h3>
  <p class="notice">Управление работами для команды /work.</p>
</section>
<section class="card">
  <h4>Новая работа</h4>
  <form id="jobsForm">
    <label><span>Название</span><input type="text" name="name" required maxlength="100" /></label>
    <label><span>Описание</span><textarea name="description" rows="2"></textarea></label>
    <label><span>Кулдаун (сек)</span><input type="number" name="cooldown_seconds" min="5" max="86400" value="3600" /></label>
    <label><span>Награда min</span><input type="number" name="reward_min" min="0" max="1000000" value="10" /></label>
    <label><span>Награда max</span><input type="number" name="reward_max" min="0" max="1000000" value="50" /></label>
    <label><span>Шанс провала (0..1)</span><input type="number" name="fail_chance" min="0" max="1" step="0.01" value="0.1" /></label>
    <label><span>Штраф min</span><input type="number" name="penalty_min" min="0" max="1000000" value="1" /></label>
    <label><span>Штраф max</span><input type="number" name="penalty_max" min="0" max="1000000" value="10" /></label>
    <label><span>Вес</span><input type="number" name="weight" min="1" max="1000" value="1" /></label>
    <label><span>Включена</span><input type="checkbox" name="enabled" checked /></label>
    <button type="submit">Добавить</button>
  </form>
</section>
<section class="card">
  <h4>Список работ</h4>
  <table class="table">
    <thead><tr><th>Название</th><th>Параметры</th><th>Статус</th><th></th></tr></thead>
    <tbody id="jobsBody"></tbody>
  </table>
</section>
