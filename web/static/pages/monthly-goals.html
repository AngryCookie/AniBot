<section class="card">
  <h3>Goals</h3>
  <p class="notice">Настройки месячных целей сообщества.</p>
  <form id="monthlyGoalsSettingsForm" class="stack gap-md">
    <label><input type="checkbox" name="enabled" checked /> Включено</label>
    <label><input type="checkbox" name="auto_generate" checked /> Автогенерация</label>
    <label>Канал анонсов ID <input type="number" name="announce_channel_id" /></label>
    <label>Роль награды ID <input type="number" name="reward_role_id" /></label>
    <label>День закрытия <input type="number" min="1" max="28" name="close_day" value="1" /></label>
    <label>Час закрытия <input type="number" min="0" max="23" name="close_hour" value="12" /></label>
    <label>Timezone <input type="text" name="timezone" value="UTC" /></label>
    <label>Default template ID <input type="number" name="default_template_id" /></label>
    <button type="submit">Сохранить настройки</button>
  </form>
</section>

<section class="card">
  <h3>Templates</h3>
  <form id="monthlyGoalTemplateForm" class="stack gap-md">
    <label>Название <input type="text" name="name" required /></label>
    <label>Описание <textarea name="description"></textarea></label>
    <label>Тип цели
      <select name="goal_type">
        <option value="voice_minutes">voice_minutes</option>
        <option value="messages">messages</option>
        <option value="economy_earned">economy_earned</option>
        <option value="betting_volume">betting_volume</option>
        <option value="pvp_volume">pvp_volume</option>
      </select>
    </label>
    <label>Target <input type="number" name="target_value" min="1" required /></label>
    <label>Eligibility type
      <select name="eligibility_type">
        <option value="voice_minutes">voice_minutes</option>
        <option value="messages">messages</option>
        <option value="economy_activity">economy_activity</option>
      </select>
    </label>
    <label>Eligibility min <input type="number" name="eligibility_min_value" min="0" value="0" /></label>
    <label><input type="checkbox" name="enabled" checked /> Enabled</label>
    <button type="submit">Создать шаблон</button>
  </form>
  <div id="goalTemplatesList" class="stack gap-sm"></div>
</section>

<section class="card" id="monthlyGoalProgressPanel">
  <div class="row" style="display:flex;justify-content:space-between;align-items:center;gap:1rem;">
    <h3 style="margin:0;">Current Goal</h3>
    <span id="monthlyGoalStatusBadge" class="badge">—</span>
  </div>
  <p id="monthlyGoalSummary">Нет данных</p>
  <div style="height: 10px; width: 100%; background: #24304d; border-radius: 999px; overflow: hidden;">
    <div id="monthlyGoalProgressBar" style="height: 100%; width: 0%; background: #4f8cff;"></div>
  </div>
  <div class="row" style="margin-top:12px; display:flex; gap:8px;">
    <button id="monthlyGoalsDryRun" type="button">Dry-run</button>
    <button id="monthlyGoalsForceClose" type="button">Force-close</button>
  </div>
</section>
