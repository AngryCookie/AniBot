<section class="page-header">
  <h3>Обзор сервера</h3>
  <p class="notice">Ключевые показатели активности и экономики выбранного сервера.</p>
</section>
<section class="card">
  <h4>Статистика сервера</h4>
  <div class="loading" id="overviewLoading">Загрузка статистики...</div>
  <div class="alert error hidden" id="overviewError" role="alert"></div>
  <div class="notice hidden" id="overviewEmpty">Нет данных для отображения.</div>
  <div class="grid hidden" id="overviewStats">
    <div class="stat" data-stat="member_count">
      <span data-stat-value>—</span>
      <p>Участники</p>
    </div>
    <div class="stat" data-stat="total_balance">
      <span data-stat-value>—</span>
      <p>Суммарный баланс</p>
    </div>
    <div class="stat" data-stat="average_level">
      <span data-stat-value>—</span>
      <p>Средний уровень</p>
    </div>
    <div class="stat" data-stat="total_warnings">
      <span data-stat-value>—</span>
      <p>Всего предупреждений</p>
    </div>
    <div class="stat" data-stat="total_shop_items">
      <span data-stat-value>—</span>
      <p>Товары в магазине</p>
    </div>
  </div>
</section>
