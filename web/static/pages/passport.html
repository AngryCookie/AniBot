<section class="card">
  <h3>Passport</h3>
  <p class="notice">Настройки карточки профиля `/passport`.</p>
  <form data-endpoint="passport" data-success-message="Настройки паспорта сохранены.">
    <label>
      <span>Включить /passport</span>
      <input type="checkbox" name="enabled" />
    </label>
    <label>
      <span>Скрывать баланс при просмотре чужого профиля</span>
      <input type="checkbox" name="hide_balance_for_others" />
    </label>
    <p class="field-hint">Помогает сохранить приватность экономики при публичном просмотре профилей.</p>
    <button type="submit">Сохранить</button>
  </form>
</section>
