<section class="page-header">
  <h3>Shop</h3>
  <p class="notice">Каталог предметов и общие настройки магазина.</p>
</section>
<section class="card">
  <h4>Настройки магазина</h4>
  <form data-endpoint="shop" data-success-message="Настройки магазина сохранены.">
    <label>
      <span>Включить магазин</span>
      <input type="checkbox" name="enabled" />
    </label>
    <label>
      <span>Показывать отсутствующие товары</span>
      <input type="checkbox" name="show_out_of_stock" />
    </label>
    <label>
      <span>Выделять скидки</span>
      <input type="checkbox" name="highlight_discounts" />
    </label>
    <div class="footer-actions">
      <button type="submit">Сохранить</button>
      <button type="button" class="danger" data-action="reset">Сбросить</button>
    </div>
  </form>
</section>
<section class="card">
  <h4>Товары магазина</h4>
  <p class="notice">Баффы: jobs_bonus — бонус к /work, xp_bonus — бонус XP, fee_reduction_* — снижение комиссий в режимах с комиссиями.</p>
  <form id="shopItemForm">
    <label>
      <span>Название</span>
      <input type="text" name="name" required />
    </label>
    <label>
      <span>Описание</span>
      <textarea name="description" rows="3"></textarea>
    </label>
    <label>
      <span>Цена</span>
      <input type="number" name="base_price" min="0" max="1000000" />
    </label>
    <label>
      <span>Тип</span>
      <select name="item_type" id="shopItemType">
        <option value="consumable">Обычный предмет</option>
        <option value="buff">Временный бафф</option>
      </select>
    </label>
    <div id="buffFields">
      <label>
        <span>Тип баффа</span>
        <select name="buff_type">
          <option value="jobs_bonus">jobs_bonus</option>
          <option value="xp_bonus">xp_bonus</option>
          <option value="fee_reduction_pvp">fee_reduction_pvp</option>
          <option value="fee_reduction_betting">fee_reduction_betting</option>
        </select>
      </label>
      <label>
        <span>Сила баффа, %</span>
        <input type="number" name="value_percent" min="1" max="100" />
      </label>
      <label>
        <span>Длительность (часы)</span>
        <input type="number" name="duration_hours" min="1" max="720" />
      </label>
      <label>
        <span>Лимит активных у пользователя</span>
        <input type="number" name="max_active_per_user" min="1" max="20" value="1" />
      </label>
    </div>
    <label>
      <span>Лимит покупок на пользователя</span>
      <input type="number" name="purchase_limit_per_user" min="1" />
    </label>
    <label>
      <span>Общий лимит покупок</span>
      <input type="number" name="purchase_limit_total" min="1" />
    </label>
    <label>
      <span>Активен</span>
      <input type="checkbox" name="is_active" checked />
    </label>
    <label>
      <span>Включён (публикация)</span>
      <input type="checkbox" name="enabled" checked />
    </label>
    <button type="submit">Добавить</button>
  </form>
  <table class="table">
    <thead>
      <tr>
        <th>Название</th>
        <th>Цена</th>
        <th>Тип</th>
        <th>Эффект</th>
        <th>Активен</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="shopItemsBody"></tbody>
  </table>
</section>
