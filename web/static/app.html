<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AniBot Admin</title>
    <link rel="stylesheet" href="/static/css/main.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div>
          <h1>AniBot Web Admin</h1>
          <p class="notice">Управление настройками Discord-бота.</p>
        </div>
        <nav aria-label="Основная навигация">
          <a href="#/overview" data-route="overview">Overview</a>
          <a href="#/leveling" data-route="leveling">Leveling</a>
          <a href="#/economy" data-route="economy">Economy</a>
          <a href="#/gambling" data-route="gambling">Gambling</a>
          <a href="#/shop" data-route="shop">Shop</a>
          <a href="#/logs" data-route="logs">Logs</a>
          <a href="#/feature-flags" data-route="feature-flags">Feature Flags</a>
          <a href="#/history" data-route="history">History</a>
        </nav>
        <div class="sidebar-footer">
          <a href="/servers.html"><button class="secondary">Сменить сервер</button></a>
          <a href="/auth/logout"><button class="secondary">Выйти</button></a>
        </div>
      </aside>
      <div class="app-main">
        <header class="app-header">
          <div>
            <h2 id="pageTitle">Обзор</h2>
            <div class="loading hidden" id="pageLoading">Загрузка...</div>
          </div>
          <div class="guild-pill" id="guildIdLabel">Guild: —</div>
        </header>
        <div class="page-content">
          <div class="alert error hidden" id="pageError" role="alert"></div>
          <div id="pageContent"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/static/js/app.js"></script>
  </body>
</html>
