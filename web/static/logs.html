<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AniBot Admin - Logs</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body data-page="logs">
    <header>
      <h1>AniBot Web Admin</h1>
    </header>
    <main>
      <div class="notice" id="guildIdLabel">Guild: —</div>
      <nav>
        <a href="/overview.html" data-page="overview">Overview</a>
        <a href="/leveling.html" data-page="leveling">Leveling</a>
        <a href="/economy.html" data-page="economy">Economy</a>
        <a href="/gambling.html" data-page="gambling">Gambling</a>
        <a href="/pvp.html" data-page="pvp">PvP</a>
        <a href="/shop.html" data-page="shop">Shop</a>
        <a href="/logs.html" data-page="logs">Logs</a>
      </nav>
      <section class="card">
        <h2>Настройки логов</h2>
        <form id="settingsForm">
          <label>
            <span>Включить логирование</span>
            <input type="checkbox" name="enabled" />
          </label>
          <label>
            <span>ID канала для логов</span>
            <input type="number" name="log_channel_id" />
          </label>
          <label>
            <span>Логи модерации</span>
            <input type="checkbox" name="log_moderation" />
          </label>
          <label>
            <span>Логи экономики</span>
            <input type="checkbox" name="log_economy" />
          </label>
          <label>
            <span>Логи азартных игр</span>
            <input type="checkbox" name="log_gambling" />
          </label>
          <div class="footer-actions">
            <button type="submit">Сохранить</button>
            <button type="button" class="danger" id="resetSettings">Сбросить</button>
          </div>
        </form>
      </section>
    </main>
    <script src="/static/app.js" defer></script>
  </body>
</html>
