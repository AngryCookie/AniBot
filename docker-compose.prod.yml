x-app-base: &app-base
  image: anibot:prod
  build:
    context: .
  env_file: .env
  environment:
    DATABASE_URL: sqlite+aiosqlite:////data/bot.db
  volumes:
    - bot_data:/data
  restart: unless-stopped
  init: true
  stop_grace_period: 30s

services:
  bot:
    <<: *app-base
    command: python -m bot.main

  web:
    <<: *app-base
    command: uvicorn web.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',8000),2); s.close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      - bot

volumes:
  bot_data:
