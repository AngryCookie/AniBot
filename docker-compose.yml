services:
  bot:
    build: .
    command: python -m bot.main
    env_file: .env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/bot.db
    volumes:
      - bot_data:/data
    restart: unless-stopped

  web:
    build: .
    command: uvicorn web.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/bot.db
    volumes:
      - bot_data:/data
    ports:
      - "8000:8000"
    depends_on:
      - bot

volumes:
  bot_data:
